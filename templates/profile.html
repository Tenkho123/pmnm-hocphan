{% extends "base.html" %}

{% block title %}Trang cá nhân{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 col-md-6 mx-auto text-center p-4">
    <div class="mb-3">
        <span class="display-3">👤</span>
    </div>
    <h3>Xin chào, <span class="text-primary">{{ username }}</span>!</h3>
    <p class="text-muted">Bạn đã đăng nhập thành công vào phiên làm việc qua Flask Session.</p>
    <div class="mt-3">
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Đăng xuất</a>
    </div>
</div>
{% endblock %}
